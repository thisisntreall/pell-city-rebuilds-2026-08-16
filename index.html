<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pell City rebuilds · 16 Aug 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Outfit, system-ui, sans-serif; background: #14120f; color: #efe8dc; }
    h1, h2 { font-family: Fraunces, Georgia, serif; }
  </style>
</head>
<body class="min-h-screen">
  <main class="mx-auto max-w-5xl px-5 py-16">
    <p class="text-xs uppercase tracking-[0.28em] text-amber-500/90">Website Prospects · Pell City</p>
    <h1 class="mt-3 text-4xl sm:text-5xl">Three sites rebuilt this pass</h1>
    <p class="mt-4 max-w-2xl text-stone-400">Faded by Bobo, Executive Cleaning, and Groomer Has It — custom one-pagers ready to pitch.</p>
    <div class="mt-12 grid gap-6 md:grid-cols-3">
      <a href="faded-by-bobo/www/" class="group block overflow-hidden border border-white/10 bg-black">
        <img src="faded-by-bobo/www/img/hero.jpg" alt="" class="h-44 w-full object-cover" />
        <div class="p-5">
          <p class="text-xs uppercase tracking-widest text-amber-500">Barber · Cogswell</p>
          <h2 class="mt-1 text-2xl">Faded by Bobo</h2>
        </div>
      </a>
      <a href="executive-cleaning/www/" class="group block overflow-hidden border border-white/10 bg-[#1a3c34]">
        <img src="executive-cleaning/www/img/hero.jpg" alt="" class="h-44 w-full object-cover" />
        <div class="p-5">
          <p class="text-xs uppercase tracking-widest text-orange-300">Residential</p>
          <h2 class="mt-1 text-2xl">Executive Cleaning</h2>
        </div>
      </a>
      <a href="groomer-has-it/www/" class="group block overflow-hidden border border-white/10 bg-[#3d2b1f]">
        <img src="groomer-has-it/www/img/hero.jpg" alt="" class="h-44 w-full object-cover" />
        <div class="p-5">
          <p class="text-xs uppercase tracking-widest text-yellow-600">Grooming · Martin St</p>
          <h2 class="mt-1 text-2xl">Groomer Has It</h2>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
